<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cula hero scrubber — performance preview</title>
<style>
  :root { --ink: #0d2039; --muted: #475569; --line: #e2e8f0; --accent: #3772ff; }
  html, body { margin: 0; padding: 0; background: #fcfdfe; font-family: system-ui, sans-serif; }

  /* ---- control panel ---- */
  .panel {
    position: fixed; top: 10px; left: 10px; z-index: 99;
    font: 12px/1.6 ui-monospace, monospace; color: var(--ink);
    background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; max-width: 360px; backdrop-filter: blur(4px);
  }
  .panel .row { margin: 2px 0; }
  .panel .lbl { display: inline-block; width: 64px; color: var(--muted); }
  .panel a {
    color: var(--accent); text-decoration: none; margin-right: 6px;
    padding: 1px 6px; border-radius: 6px; border: 1px solid transparent;
  }
  .panel a.on { border-color: var(--accent); font-weight: 700; }
  .panel .stats { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); }
  .panel.collapsed .row, .panel.collapsed .stats { display: none; }
  .panel .toggle-panel { float: right; cursor: pointer; color: var(--muted); }

  /* ---- scrub stage ---- */
  .stage-outer { display: flex; justify-content: center; }
  /* desktop: stage is the window itself */
  .stage.window { width: 100%; }
  /* device simulation: fixed-size frame with its own scrollbar */
  .stage.device {
    position: relative;
    overflow-y: auto; overflow-x: hidden;
    border: 12px solid #0d2039; border-radius: 28px;
    margin: 56px 0; background: #fff;
    box-shadow: 0 20px 60px rgba(13,32,57,.25);
  }
  /* blocking loading screen (covers the scroller until the gate is ready) */
  .gate-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #fcfdfe; transition: opacity .35s ease;
  }
  .gate-overlay.device { position: absolute; border-radius: 16px; }
  .gate-overlay .bar { width: 240px; height: 3px; border-radius: 2px; background: rgba(13,32,57,.12); overflow: hidden; }
  .gate-overlay .fill { width: 0%; height: 100%; background: var(--ink); transition: width .15s ease-out; }
  .gate-overlay .lbl2 { font: 11px/1 ui-monospace, monospace; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .gate-overlay.hide { opacity: 0; pointer-events: none; }
  .scrub-wrap { position: relative; }
  .scrub-media {
    position: sticky; top: 0;
    width: 100%; display: block; object-fit: cover;
  }
  .loader { position: sticky; top: 50%; display: flex; justify-content: center; pointer-events: none; }
  .loader .bar { width: 200px; height: 2px; border-radius: 1px; background: rgba(0,0,0,.15); overflow: hidden; }
  .loader .fill { width: 0%; height: 100%; background: rgba(0,0,0,.7); transition: width .15s ease-out; }
  .after { height: 120vh; display: flex; align-items: center; justify-content: center;
           font: 600 20px/1.4 system-ui; color: var(--muted); text-align: center; padding: 0 24px; }
</style>
</head>
<body>
<div class="panel" id="panel"></div>
<div class="stage-outer" id="stageOuter"></div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);

  // ---- frame sets (all served from jsDelivr, branch hero-v2-preview) ----
  const CDN = 'https://cdn.jsdelivr.net/gh/simonstadlinger/cula-website-assets@hero-v2-preview';
  const SETS = {
    desktop: {
      'webp-full': { base: CDN + '/hero-animation-v2',              ext: '.webp', label: 'webp 1920' },
      'webp-lo':   { base: CDN + '/hero-frames/desktop-webp-1600',  ext: '.webp', label: 'webp 1600' },
      'avif-full': { base: CDN + '/hero-frames/desktop-avif-1920',  ext: '.avif', label: 'avif 1920' },
      'avif-lo':   { base: CDN + '/hero-frames/desktop-avif-1600',  ext: '.avif', label: 'avif 1600' }
    },
    mobile: {
      'webp-full': { base: CDN + '/hero-frames/mobile-webp-1080',   ext: '.webp', label: 'webp 1080h' },
      'webp-lo':   { base: CDN + '/hero-frames/mobile-webp-810',    ext: '.webp', label: 'webp 810h' },
      'avif-full': { base: CDN + '/hero-frames/mobile-avif-1080',   ext: '.avif', label: 'avif 1080h' },
      'avif-lo':   { base: CDN + '/hero-frames/mobile-avif-810',    ext: '.avif', label: 'avif 810h' }
    },
    // reference: what the live site loads today
    live: {
      'webp-full': { base: CDN.replace('@hero-v2-preview', '@main') + '/hero-animation', ext: '.webp', label: 'original webp 1920 (q90)' }
    }
  };
  // tablet shares the desktop sets (landscape tablets need wide frames); 1600px tier recommended
  const VIEWPORTS = {
    desktop: { sets: 'desktop', device: null,                defaults: { set: 'webp-full' } },
    tablet:  { sets: 'desktop', device: { w: 834, h: 1150 }, defaults: { set: 'webp-lo' } },
    mobile:  { sets: 'mobile',  device: { w: 390, h: 780 },  defaults: { set: 'webp-full' } }
  };

  // ---- config from URL ----
  const onPhone = matchMedia('(max-width: 767px)').matches;
  const cfg = {
    vp:   qs.get('vp')   || (onPhone ? 'mobile' : 'desktop'),
    set:  qs.get('set'),
    step: parseInt(qs.get('step') || '2', 10),
    len:  parseInt(qs.get('len') || '5000', 10),
    head: parseInt(qs.get('head') || '15', 10), // % of frames gated densely from the start
    lock: qs.has('lock') ? qs.get('lock') === '1' : true, // block scroll behind a loading screen until the gate is ready
    live: qs.has('live')
  };
  if (!VIEWPORTS[cfg.vp]) cfg.vp = 'desktop';
  const vp = VIEWPORTS[cfg.vp];
  const setGroup = cfg.live ? SETS.live : SETS[vp.sets];
  if (!setGroup[cfg.set]) cfg.set = cfg.live ? 'webp-full' : vp.defaults.set;
  if (cfg.live) {
    cfg.step = parseInt(qs.get('step') || '8', 10); // live site uses step 8
    cfg.head = parseInt(qs.get('head') || '0', 10); // and gates on the skeleton only
    if (!qs.has('lock')) cfg.lock = false; // the real site doesn't block scroll while loading
  }
  const SET = setGroup[cfg.set];

  // on a real phone, don't draw a fake device frame — use the actual window
  const simulateDevice = vp.device && !onPhone;

  // ---- build URL list (identical logic to the Framer component) ----
  performance.setResourceTimingBufferSize(4000);
  const FRAME_COUNT = 1417, PAD = 4, START = 1, PREFIX = 'frame_';
  const urls = [];
  for (let i = 0; i < FRAME_COUNT; i += Math.max(1, cfg.step)) {
    urls.push(`${SET.base}/${PREFIX}${String(START + i).padStart(PAD, '0')}${SET.ext}`);
  }
  const N = urls.length;

  // ---- stage DOM ----
  const outer = document.getElementById('stageOuter');
  const stage = document.createElement('div');
  stage.className = 'stage ' + (simulateDevice ? 'device' : 'window');
  if (simulateDevice) {
    stage.style.width = vp.device.w + 'px';
    stage.style.height = Math.min(vp.device.h, innerHeight - 130) + 'px';
  }
  const wrap = document.createElement('div');
  wrap.className = 'scrub-wrap';
  wrap.style.height = cfg.len + 'px';
  const img = document.createElement('img');
  img.className = 'scrub-media';
  img.alt = '';
  const loader = document.createElement('div');
  loader.className = 'loader';
  loader.innerHTML = '<div class="bar"><div class="fill"></div></div>';
  const after = document.createElement('div');
  after.className = 'after';
  after.textContent = 'rest of the page — scroll back up to scrub again';
  wrap.append(img, loader);
  stage.append(wrap, after);
  outer.append(stage);

  const scroller = simulateDevice ? stage : window;
  const stageH = () => simulateDevice ? stage.clientHeight : innerHeight;
  img.style.height = simulateDevice ? stage.clientHeight + 'px' : '100lvh';
  loader.style.marginTop = `calc(-${simulateDevice ? stage.clientHeight / 2 + 'px' : '50lvh'})`;

  // ---- state ----
  const loaded = new Uint8Array(N);
  const images = new Array(N);
  let lastShownIdx = -1;
  let gateSeconds = null, allSeconds = null;

  // ---- control panel ----
  const panel = document.getElementById('panel');
  function link(mutate) {
    const p = new URLSearchParams(location.search);
    mutate(p);
    return location.pathname + (p.toString() ? '?' + p : '');
  }
  function opt(label, on, href) {
    return `<a href="${href}" class="${on ? 'on' : ''}">${label}</a>`;
  }
  function transferredMB() {
    let bytes = 0;
    for (const e of performance.getEntriesByType('resource')) {
      if (e.name.includes('cdn.jsdelivr.net')) bytes += (e.transferSize || e.encodedBodySize || 0);
    }
    return bytes / 1048576;
  }
  function renderPanel() {
    const fmts = cfg.live ? '' :
      Object.entries(setGroup).map(([k, s]) =>
        opt(s.label, k === cfg.set, link(p => { p.set('set', k); }))).join('');
    panel.innerHTML =
      `<span class="toggle-panel" id="pToggle">▣</span>` +
      `<div class="row"><span class="lbl">viewport</span>` +
        ['desktop', 'tablet', 'mobile'].map(v =>
          opt(v, v === cfg.vp && !cfg.live, link(p => { p.set('vp', v); p.delete('set'); p.delete('live'); }))).join('') +
        opt('live site today', cfg.live, link(p => { p.set('live', '1'); p.delete('set'); p.delete('vp'); p.delete('step'); p.delete('lock'); })) +
      `</div>` +
      (fmts ? `<div class="row"><span class="lbl">frames</span>${fmts}</div>` : '') +
      `<div class="row"><span class="lbl">step</span>` +
        [1, 2, 3, 8].map(s => opt(String(s), s === cfg.step, link(p => p.set('step', String(s))))).join('') +
      `</div>` +
      `<div class="row"><span class="lbl">scroll</span>` +
        [3930, 5000, 6500].map(l => opt(l + 'px', l === cfg.len, link(p => p.set('len', String(l))))).join('') +
      `</div>` +
      `<div class="row"><span class="lbl">gate head</span>` +
        [0, 15, 30].map(h => opt(h + '%', h === cfg.head, link(p => p.set('head', String(h))))).join('') +
      `</div>` +
      `<div class="row"><span class="lbl">gate loader</span>` +
        opt('blocking', cfg.lock, link(p => p.set('lock', '1'))) +
        opt('non-blocking', !cfg.lock, link(p => p.set('lock', '0'))) +
      `</div>` +
      `<div class="stats">` +
        `${N} frames · loaded ${loaded.reduce((a, b) => a + b, 0)}/${N} · showing #${lastShownIdx}<br>` +
        `downloaded ${transferredMB().toFixed(1)} MB` +
        (gateSeconds !== null ? ` · loader gate ${gateSeconds.toFixed(1)}s` : '') +
        (allSeconds !== null ? ` · all ${allSeconds.toFixed(1)}s` : '') +
      `</div>`;
    document.getElementById('pToggle').onclick = () => panel.classList.toggle('collapsed');
  }

  // ---- nearest-loaded fallback (same as component) ----
  function nearestLoaded(i) {
    if (loaded[i]) return i;
    for (let d = 1; d < N; d++) {
      if (i - d >= 0 && loaded[i - d]) return i - d;
      if (i + d < N && loaded[i + d]) return i + d;
    }
    return i;
  }
  function show(i) {
    const idx = nearestLoaded(i);
    if (idx === lastShownIdx) return;
    img.src = urls[idx];
    lastShownIdx = idx;
  }

  // ---- scroll mapping ----
  function update() {
    const y = simulateDevice ? stage.scrollTop : window.pageYOffset;
    const top = simulateDevice ? 0 : wrap.getBoundingClientRect().top + window.pageYOffset;
    const span = cfg.len - stageH();
    if (span <= 0) return;
    const frac = Math.max(0, Math.min(1, (y - (simulateDevice ? 0 : top)) / span));
    show(Math.min(N - 1, Math.floor(frac * N)));
    renderPanel();
  }
  let raf = null;
  scroller.addEventListener('scroll', () => {
    if (raf === null) raf = requestAnimationFrame(() => { raf = null; update(); });
  }, { passive: true });
  addEventListener('resize', update);

  // ---- two-pass preloader (same strategy as the Framer component) ----
  const fill = loader.querySelector('.fill');
  function loadSet(indices, onEach) {
    return new Promise(resolve => {
      if (!indices.length) return resolve();
      let next = 0, active = 0;
      const pump = () => {
        while (active < 10 && next < indices.length) {
          const idx = indices[next++];
          active++;
          const im = new Image();
          images[idx] = im;
          const fin = () => {
            active--;
            loaded[idx] = 1;
            onEach && onEach();
            if (next >= indices.length && active === 0) resolve(); else pump();
          };
          im.onload = fin;
          im.onerror = fin;
          im.src = urls[idx];
        }
      };
      pump();
    });
  }
  // gate = dense head (first `head` %) + every-8th skeleton + last frame
  const headCount = Math.ceil((Math.max(0, Math.min(100, cfg.head)) / 100) * N);
  const coarse = [];
  const inGate = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    if (i < headCount || i % 8 === 0 || i === N - 1) { coarse.push(i); inGate[i] = 1; }
  }
  const fine = [];
  for (let i = 0; i < N; i++) if (!inGate[i]) fine.push(i);

  // ---- blocking loading screen: lock scroll until the gate is ready ----
  function lockScroll() {
    if (simulateDevice) { stage.scrollTop = 0; stage.style.overflowY = 'hidden'; }
    else { window.scrollTo(0, 0); document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden'; }
  }
  function unlockScroll() {
    if (simulateDevice) stage.style.overflowY = 'auto';
    else { document.documentElement.style.overflow = ''; document.body.style.overflow = ''; }
  }
  let overlay = null, gateFill = fill;
  if (cfg.lock) {
    overlay = document.createElement('div');
    overlay.className = 'gate-overlay' + (simulateDevice ? ' device' : '');
    overlay.innerHTML = '<div class="bar"><div class="fill"></div></div><div class="lbl2">loading</div>';
    (simulateDevice ? stage : document.body).appendChild(overlay);
    gateFill = overlay.querySelector('.fill');
    loader.style.display = 'none'; // thin sticky bar not needed while the overlay is up
    lockScroll();
  }

  renderPanel();
  const t0 = performance.now();
  let done = 0;
  loadSet(coarse, () => {
    done++;
    gateFill.style.width = Math.round((done / coarse.length) * 100) + '%';
    if (lastShownIdx === -1) update();
  }).then(() => {
    gateSeconds = (performance.now() - t0) / 1000;
    if (overlay) {
      unlockScroll();
      overlay.classList.add('hide');
      setTimeout(() => overlay.remove(), 400);
    } else {
      loader.style.display = 'none';
    }
    update();
    return loadSet(fine, null);
  }).then(() => {
    allSeconds = (performance.now() - t0) / 1000;
    lastShownIdx = -1;
    update();
  });
})();
</script>
</body>
</html>
